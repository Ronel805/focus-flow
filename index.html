<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פוקוס-פלו | מעקב הרגלים</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Supabase Credentials
    const SUPABASE_URL = "https://wwicfhomrexzczlhqlgx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_5fELLN6m3tMcIZxRmLNIYQ_OwX13l4i";

    const supabase = (SUPABASE_URL && SUPABASE_ANON_KEY) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    function App() {
      const [habits, setHabits] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filter, setFilter] = useState('all');
      const [showAddModal, setShowAddModal] = useState(false);
      const [newTitle, setNewTitle] = useState('');
      const [newMicro, setNewMicro] = useState('');
      const [newTime, setNewTime] = useState('');

      const todayKey = new Date().toISOString().split('T')[0];

      // טעינת הרגלים מ-Supabase (עם גיבוי מקומי)
      useEffect(() => {
        async function fetchHabits() {
          if (supabase) {
            try {
              const { data, error } = await supabase.from('habits').select('*');
              if (!error && data && data.length > 0) {
                const formatted = data.map(item => ({
                  ...item,
                  microHabit: item.micro_habit,
                  targetTime: item.target_time,
                  logs: item.logs || {}
                }));
                setHabits(formatted);
                setLoading(false);
                return;
              }
            } catch (err) {
              console.error("Supabase fetch error:", err);
            }
          }
          const saved = localStorage.getItem('focus_flow_habits');
          setHabits(saved ? JSON.parse(saved) : []);
          setLoading(false);
        }
        fetchHabits();
      }, []);

      const saveHabits = async (updatedHabits) => {
        setHabits(updatedHabits);
        localStorage.setItem('focus_flow_habits', JSON.stringify(updatedHabits));
      };

      const toggleHabit = async (id) => {
        const updated = habits.map(h => {
          if (h.id !== id) return h;
          const isDone = !!(h.logs && h.logs[todayKey]);
          const updatedLogs = { ...(h.logs || {}) };
          if (isDone) {
            delete updatedLogs[todayKey];
          } else {
            updatedLogs[todayKey] = true;
            if (window.confetti) {
              window.confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
            }
          }
          return {
            ...h,
            logs: updatedLogs,
            streak: !isDone ? h.streak + 1 : Math.max(0, h.streak - 1)
          };
        });

        await saveHabits(updated);

        if (supabase) {
          const target = updated.find(h => h.id === id);
          await supabase.from('habits').upsert({
            id: target.id,
            title: target.title,
            micro_habit: target.microHabit,
            streak: target.streak,
            logs: target.logs
          });
        }
      };

      const addHabit = async (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const habit = {
          id: Date.now().toString(),
          title: newTitle,
          microHabit: newMicro,
          category: 'כללי',
          targetTime: newTime || '09:00',
          days: [0, 1, 2, 3, 4, 5, 6],
          streak: 0,
          shieldsUsed: 0,
          logs: {}
        };

        const updated = [...habits, habit];
        await saveHabits(updated);

        if (supabase) {
          await supabase.from('habits').insert([{
            id: habit.id,
            title: habit.title,
            micro_habit: habit.microHabit,
            target_time: habit.targetTime,
            days: habit.days,
            streak: 0,
            logs: {}
          }]);
        }

        setNewTitle('');
        setNewMicro('');
        setNewTime('');
        setShowAddModal(false);
      };

      const totalCompletedToday = habits.filter(h => h.logs && h.logs[todayKey]).length;
      const progressPercent = habits.length > 0 ? Math.round((totalCompletedToday / habits.length) * 100) : 0;

      const filteredHabits = habits.filter(h => {
        const done = !!(h.logs && h.logs[todayKey]);
        if (filter === 'pending') return !done;
        if (filter === 'completed') return done;
        return true;
      });

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">
            טוען את ההרגלים שלך מ-Supabase...
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto p-4 sm:p-6 space-y-6 pb-20">
          <header className="bg-slate-800 border border-slate-700/80 rounded-2xl p-5 shadow-xl">
            <div className="flex items-center justify-between mb-4">
              <div>
                <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                  <span>⚡</span> פוקוס-פלו
                </h1>
                <p className="text-xs text-emerald-400 mt-0.5 font-medium flex items-center gap-1">
                  <span>☁️</span> מחובר לסופרבייס בענן
                </p>
              </div>
              <div className="bg-slate-900/80 border border-slate-700 px-3 py-1.5 rounded-xl text-center">
                <span className="text-xs text-slate-400 block">מגן מנוחה</span>
                <span className="text-sm font-bold text-amber-400">🛡️ 2/2</span>
              </div>
            </div>

            <div className="space-y-1.5">
              <div className="flex justify-between text-xs font-semibold">
                <span className="text-slate-300">הושלם היום</span>
                <span className="text-emerald-400">{progressPercent}%</span>
              </div>
              <div className="h-3 w-full bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                <div 
                  className="h-full bg-gradient-to-l from-emerald-400 to-teal-500 rounded-full transition-all duration-500"
                  style={{ width: `${progressPercent}%` }}
                />
              </div>
            </div>
          </header>

          <div className="flex items-center justify-between gap-2">
            <div className="flex bg-slate-800 p-1 rounded-xl border border-slate-700/80 text-xs font-medium">
              <button 
                onClick={() => setFilter('all')}
                className={`px-3 py-1.5 rounded-lg transition-all ${filter === 'all' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}
              >
                הכל ({habits.length})
              </button>
              <button 
                onClick={() => setFilter('pending')}
                className={`px-3 py-1.5 rounded-lg transition-all ${filter === 'pending' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}
              >
                לביצוע ({habits.length - totalCompletedToday})
              </button>
              <button 
                onClick={() => setFilter('completed')}
                className={`px-3 py-1.5 rounded-lg transition-all ${filter === 'completed' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}
              >
                הושלם ({totalCompletedToday})
              </button>
            </div>

            <button 
              onClick={() => setShowAddModal(true)}
              className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1 shadow-lg shadow-emerald-500/20 active:scale-95 transition-all"
            >
              <span>+</span> הרגל חדש
            </button>
          </div>

          <div className="space-y-3">
            {filteredHabits.length === 0 ? (
              <div className="text-center py-10 bg-slate-800/40 rounded-2xl border border-dashed border-slate-700 text-slate-400 text-sm">
                אין הרגלים להצגה. לחץ על "+ הרגל חדש" כדי להתחיל!
              </div>
            ) : (
              filteredHabits.map(habit => {
                const isDone = !!(habit.logs && habit.logs[todayKey]);
                return (
                  <div 
                    key={habit.id}
                    onClick={() => toggleHabit(habit.id)}
                    className={`p-4 rounded-2xl border cursor-pointer transition-all duration-200 select-none flex items-start gap-3.5 ${
                      isDone 
                        ? 'bg-emerald-950/20 border-emerald-500/40 opacity-90' 
                        : 'bg-slate-800 border-slate-700 hover:border-slate-600 shadow-md'
                    }`}
                  >
                    <div className={`mt-0.5 w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${
                      isDone ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-500 bg-slate-900'
                    }`}>
                      {isDone && <span className="font-extrabold text-xs">✓</span>}
                    </div>

                    <div className="flex-1 min-w-0">
                      <div className="flex items-center justify-between gap-2">
                        <h3 className={`font-semibold text-sm truncate ${isDone ? 'line-through text-slate-400' : 'text-slate-100'}`}>
                          {habit.title}
                        </h3>
                        <span className="text-xs font-bold text-amber-400 bg-amber-400/10 border border-amber-400/20 px-2 py-0.5 rounded-full flex items-center gap-1">
                          🔥 {habit.streak}
                        </span>
                      </div>
                      {habit.microHabit && (
                        <p className="text-xs text-emerald-400/90 mt-1 flex items-center gap-1 bg-emerald-500/10 p-1.5 rounded-lg border border-emerald-500/20">
                          <span>💡</span> {habit.microHabit}
                        </p>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {showAddModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                  <h3 className="font-bold text-lg text-white">הוספת הרגל חדש</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={addHabit} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">שם ההרגל</label>
                    <input 
                      type="text" 
                      required
                      placeholder="למשל: לקרוא ספר"
                      value={newTitle}
                      onChange={e => setNewTitle(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">מיקרו-הרגל (צעד של 2 דקות)</label>
                    <input 
                      type="text" 
                      placeholder="למשל: לפתוח את הספר בעמוד 1"
                      value={newMicro}
                      onChange={e => setNewMicro(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button 
                      type="submit" 
                      className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition-all"
                    >
                      שמור הרגל
                    </button>
                    <button 
                      type="button" 
                      onClick={() => setShowAddModal(false)}
                      className="px-4 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2.5 rounded-xl text-sm transition-all"
                    >
                      ביטול
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
