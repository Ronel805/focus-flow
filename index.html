<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פוקוס-פלו | FocusFlow</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .heatmap-grid { display: grid; grid-template-rows: repeat(7, minmax(0, 1fr)); grid-auto-flow: column; gap: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Supabase Credentials
    const SUPABASE_URL = "https://wwicfhomrexzczlhqlgx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_5fELLN6m3tMcIZxRmLNIYQ_OwX13l4i";

    const supabase = (SUPABASE_URL && SUPABASE_ANON_KEY) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const BADGES = [
      { id: 'first_step', name: 'צעד ראשון', desc: 'השלמת הרגל ראשון', icon: '🌱' },
      { id: 'streak_3', name: 'בונה תנופה', desc: 'רצף פעיל של 3 ימים', icon: '⚡' },
      { id: 'streak_7', name: 'לוחם 7 ימים', desc: 'שמירה על רצף של 7 ימים', icon: '🔥' },
      { id: 'shield_user', name: 'מאסטר המגן', desc: 'שימוש במגן מנוחה לשמירה על רצף', icon: '🛡️' },
      { id: 'century', name: 'מועדון ה-100', desc: 'השלמת 100 הרגלים מצטברים', icon: '👑' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('habits'); // 'habits' | 'chores' | 'calendar' | 'stats'
      const [currentUser, setCurrentUser] = useState('נועה'); // 'נועה' | 'רונאל'
      
      // Habits State
      const [habits, setHabits] = useState([]);
      const [filter, setFilter] = useState('all');
      const [showAddHabitModal, setShowAddHabitModal] = useState(false);
      const [newTitle, setNewTitle] = useState('');
      const [newMicro, setNewMicro] = useState('');

      // Chores State
      const [chores, setChores] = useState(() => {
        const saved = localStorage.getItem('focus_flow_chores');
        return saved ? JSON.parse(saved) : [
          { id: '1', title: 'להוריד את הזבל', assignedTo: 'רונאל', done: false },
          { id: '2', title: 'לקנות מצרכים לשבת', assignedTo: 'נועה', done: true },
          { id: '3', title: 'לקפל כביסה', assignedTo: 'נועה', done: false }
        ];
      });
      const [newChoreTitle, setNewChoreTitle] = useState('');
      const [newChoreAssignee, setNewChoreAssignee] = useState('נועה');

      // Calendar State
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [calendarEvents, setCalendarEvents] = useState(() => {
        const saved = localStorage.getItem('focus_flow_calendar');
        return saved ? JSON.parse(saved) : {
          [new Date().toISOString().split('T')[0]]: ['אימון כושר', 'פגישה שבועית']
        };
      });
      const [newEventText, setNewEventText] = useState('');

      const todayKey = new Date().toISOString().split('T')[0];

      // Fetch Habits from Supabase
      useEffect(() => {
        async function fetchHabits() {
          if (supabase) {
            try {
              const { data, error } = await supabase.from('habits').select('*');
              if (!error && data && data.length > 0) {
                const formatted = data.map(item => ({
                  ...item,
                  microHabit: item.micro_habit,
                  logs: item.logs || {}
                }));
                setHabits(formatted);
                return;
              }
            } catch (err) {
              console.error("Supabase error:", err);
            }
          }
          const saved = localStorage.getItem('focus_flow_habits');
          setHabits(saved ? JSON.parse(saved) : [
            { id: '1', title: 'אימון ריצה / הליכה', microHabit: 'לנעול נעלי ספורט ולצאת ל-2 דקות', streak: 5, logs: {} },
            { id: '2', title: 'קריאת ספר', microHabit: 'לקרוא עמוד אחד בלבד', streak: 12, logs: {} }
          ]);
        }
        fetchHabits();
      }, []);

      useEffect(() => {
        localStorage.setItem('focus_flow_chores', JSON.stringify(chores));
      }, [chores]);

      useEffect(() => {
        localStorage.setItem('focus_flow_calendar', JSON.stringify(calendarEvents));
      }, [calendarEvents]);

      // Habits Actions (Saves to Supabase)
      const toggleHabit = async (id) => {
        const updated = habits.map(h => {
          if (h.id !== id) return h;
          const isDone = !!(h.logs && h.logs[todayKey]);
          const updatedLogs = { ...(h.logs || {}) };
          if (isDone) {
            delete updatedLogs[todayKey];
          } else {
            updatedLogs[todayKey] = true;
            if (window.confetti) {
              window.confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
            }
          }
          return {
            ...h,
            logs: updatedLogs,
            streak: !isDone ? h.streak + 1 : Math.max(0, h.streak - 1)
          };
        });

        setHabits(updated);
        localStorage.setItem('focus_flow_habits', JSON.stringify(updated));

        if (supabase) {
          const target = updated.find(h => h.id === id);
          await supabase.from('habits').upsert({
            id: target.id,
            title: target.title,
            micro_habit: target.microHabit,
            streak: target.streak,
            logs: target.logs
          });
        }
      };

      const addHabit = async (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const habit = {
          id: Date.now().toString(),
          title: newTitle,
          microHabit: newMicro,
          streak: 0,
          logs: {}
        };
        const updated = [...habits, habit];
        setHabits(updated);
        localStorage.setItem('focus_flow_habits', JSON.stringify(updated));

        if (supabase) {
          await supabase.from('habits').insert([{
            id: habit.id,
            title: habit.title,
            micro_habit: habit.microHabit,
            streak: 0,
            logs: {}
          }]);
        }
        setNewTitle('');
        setNewMicro('');
        setShowAddHabitModal(false);
      };

      // Chores Actions
      const toggleChore = (id) => {
        setChores(chores.map(c => c.id === id ? { ...c, done: !c.done } : c));
      };

      const addChore = (e) => {
        e.preventDefault();
        if (!newChoreTitle.trim()) return;
        setChores([...chores, { id: Date.now().toString(), title: newChoreTitle, assignedTo: newChoreAssignee, done: false }]);
        setNewChoreTitle('');
      };

      // Calendar Helpers
      const addCalendarEvent = (e) => {
        e.preventDefault();
        if (!newEventText.trim()) return;
        const currentEvents = calendarEvents[selectedDate] || [];
        setCalendarEvents({ ...calendarEvents, [selectedDate]: [...currentEvents, newEventText] });
        setNewEventText('');
      };

      const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const daysInMonth = getDaysInMonth(year, month);
      const firstDay = getFirstDayOfMonth(year, month);

      const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];

      const totalCompletedToday = habits.filter(h => h.logs && h.logs[todayKey]).length;
      const progressPercent = habits.length > 0 ? Math.round((totalCompletedToday / habits.length) * 100) : 0;

      return (
        <div className="max-w-md mx-auto p-4 sm:p-6 space-y-5 pb-24">
          {/* Header */}
          <header className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
            <div className="flex items-center justify-between">
              <div>
                <h1 className="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                  <span className="text-emerald-400">⚡</span> פוקוס-פלו
                </h1>
                <p className="text-xs text-emerald-400/90 font-medium mt-0.5 flex items-center gap-1">
                  <span>☁️</span> מחובר וסגור ב-Supabase
                </p>
              </div>

              <div className="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-2xl flex items-center gap-2">
                <span className="text-xs text-slate-400">משתמש:</span>
                <select 
                  value={currentUser} 
                  onChange={(e) => setCurrentUser(e.target.value)}
                  className="bg-transparent text-xs font-bold text-emerald-400 outline-none cursor-pointer"
                >
                  <option value="נועה" className="bg-slate-900 text-white">נועה 👩🏻‍🦰</option>
                  <option value="רונאל" className="bg-slate-900 text-white">רונאל 👦🏻</option>
                </select>
              </div>
            </div>

            {activeTab === 'habits' && (
              <div className="space-y-1.5 pt-2 border-t border-slate-800/80">
                <div className="flex justify-between text-xs font-semibold">
                  <span className="text-slate-300">התקדמות יומית</span>
                  <span className="text-emerald-400 font-bold">{progressPercent}%</span>
                </div>
                <div className="h-3 w-full bg-slate-950 rounded-full overflow-hidden p-0.5 border border-slate-800">
                  <div 
                    className="h-full bg-gradient-to-l from-emerald-400 to-teal-500 rounded-full transition-all duration-500"
                    style={{ width: `${progressPercent}%` }}
                  />
                </div>
              </div>
            )}
          </header>

          {/* Nav Tabs */}
          <nav className="grid grid-cols-4 gap-1 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 text-[11px] font-bold">
            <button onClick={() => setActiveTab('habits')} className={`py-2 rounded-xl transition-all flex flex-col items-center gap-1 ${activeTab === 'habits' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400'}`}>
              <span className="text-base">⚡</span> הרגלים
            </button>
            <button onClick={() => setActiveTab('chores')} className={`py-2 rounded-xl transition-all flex flex-col items-center gap-1 ${activeTab === 'chores' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400'}`}>
              <span className="text-base">🏠</span> משימות
            </button>
            <button onClick={() => setActiveTab('calendar')} className={`py-2 rounded-xl transition-all flex flex-col items-center gap-1 ${activeTab === 'calendar' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400'}`}>
              <span className="text-base">📅</span> יומן
            </button>
            <button onClick={() => setActiveTab('stats')} className={`py-2 rounded-xl transition-all flex flex-col items-center gap-1 ${activeTab === 'stats' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400'}`}>
              <span className="text-base">📊</span> נתונים
            </button>
          </nav>

          {/* TAB 1: HABITS */}
          {activeTab === 'habits' && (
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-medium">
                  <button onClick={() => setFilter('all')} className={`px-3 py-1 rounded-lg ${filter === 'all' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}>הכל</button>
                  <button onClick={() => setFilter('pending')} className={`px-3 py-1 rounded-lg ${filter === 'pending' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}>לביצוע</button>
                  <button onClick={() => setFilter('completed')} className={`px-3 py-1 rounded-lg ${filter === 'completed' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}>הושלם</button>
                </div>
                <button onClick={() => setShowAddHabitModal(true)} className="bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs">+ הרגל</button>
              </div>

              <div className="space-y-3">
                {habits.map(habit => {
                  const isDone = !!(habit.logs && habit.logs[todayKey]);
                  return (
                    <div key={habit.id} onClick={() => toggleHabit(habit.id)} className={`p-4 rounded-2xl border cursor-pointer transition-all flex items-start gap-3.5 ${isDone ? 'bg-emerald-950/20 border-emerald-500/40 opacity-80' : 'bg-slate-900 border-slate-800'}`}>
                      <div className={`mt-0.5 w-6 h-6 rounded-lg border-2 flex items-center justify-center ${isDone ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600 bg-slate-950'}`}>
                        {isDone && <span className="font-black text-xs">✓</span>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between gap-2">
                          <h3 className={`font-bold text-sm truncate ${isDone ? 'line-through text-slate-400' : 'text-slate-100'}`}>{habit.title}</h3>
                          <span className="text-xs font-bold text-amber-400 bg-amber-400/10 border border-amber-400/20 px-2 py-0.5 rounded-full">🔥 {habit.streak}</span>
                        </div>
                        {habit.microHabit && <p className="text-xs text-emerald-400/90 mt-1.5 flex items-center gap-1 bg-emerald-500/10 p-1.5 rounded-lg border border-emerald-500/20"><span>💡</span> {habit.microHabit}</p>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* TAB 2: HOUSEHOLD CHORES */}
          {activeTab === 'chores' && (
            <div className="space-y-4">
              <form onSubmit={addChore} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                <h3 className="text-xs font-bold text-slate-300">הוספת מטלת בית זוגית</h3>
                <div className="flex gap-2">
                  <input type="text" placeholder="מה צריך לעשות בבית?" value={newChoreTitle} onChange={(e) => setNewChoreTitle(e.target.value)} className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  <select value={newChoreAssignee} onChange={(e) => setNewChoreAssignee(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-emerald-400 font-bold outline-none">
                    <option value="נועה">נועה</option>
                    <option value="רונאל">רונאל</option>
                  </select>
                  <button type="submit" className="bg-emerald-500 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs">הוסף</button>
                </div>
              </form>

              <div className="space-y-2.5">
                {chores.map(chore => (
                  <div key={chore.id} onClick={() => toggleChore(chore.id)} className={`p-3.5 rounded-2xl border cursor-pointer transition-all flex items-center justify-between ${chore.done ? 'bg-slate-950/50 border-slate-900 opacity-60' : 'bg-slate-900 border-slate-800'}`}>
                    <div className="flex items-center gap-3">
                      <div className={`w-5 h-5 rounded-md border-2 flex items-center justify-center ${chore.done ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600 bg-slate-950'}`}>{chore.done && <span className="font-bold text-xs">✓</span>}</div>
                      <span className={`text-sm font-medium ${chore.done ? 'line-through text-slate-500' : 'text-slate-100'}`}>{chore.title}</span>
                    </div>
                    <span className={`text-xs px-2.5 py-1 rounded-full font-bold border ${chore.assignedTo === 'נועה' ? 'bg-purple-500/10 border-purple-500/30 text-purple-300' : 'bg-blue-500/10 border-blue-500/30 text-blue-300'}`}>👤 {chore.assignedTo}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 3: CALENDAR (FULL INTERACTIVE MONTH GRID) */}
          {activeTab === 'calendar' && (
            <div className="space-y-4">
              {/* Month Header */}
              <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <button onClick={() => setCurrentMonth(new Date(year, month - 1, 1))} className="text-xs bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-emerald-400 font-bold">← חודש קודם</button>
                  <h3 className="font-bold text-sm text-white">{monthNames[month]} {year}</h3>
                  <button onClick={() => setCurrentMonth(new Date(year, month + 1, 1))} className="text-xs bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-emerald-400 font-bold">חודש הבא →</button>
                </div>

                {/* Days Grid Header */}
                <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400">
                  <span>א'</span><span>ב'</span><span>ג'</span><span>ד'</span><span>ה'</span><span>ו'</span><span>ש'</span>
                </div>

                {/* Calendar Days */}
                <div className="grid grid-cols-7 gap-1 text-center text-xs">
                  {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`} />)}
                  {Array.from({ length: daysInMonth }).map((_, i) => {
                    const dayNum = i + 1;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                    const isSelected = selectedDate === dateStr;
                    const isToday = todayKey === dateStr;
                    const hasEvents = calendarEvents[dateStr] && calendarEvents[dateStr].length > 0;

                    return (
                      <button
                        key={dayNum}
                        onClick={() => setSelectedDate(dateStr)}
                        className={`py-2 rounded-xl border relative font-semibold transition-all ${
                          isSelected ? 'bg-emerald-500 border-emerald-500 text-slate-950 font-black scale-105' :
                          isToday ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-400' :
                          'bg-slate-950 border-slate-800/80 text-slate-200 hover:border-slate-700'
                        }`}
                      >
                        {dayNum}
                        {hasEvents && <span className="absolute bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-amber-400 rounded-full" />}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Event Viewer & Add Box */}
              <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <h4 className="text-xs font-bold text-slate-300">אירועים ליום {selectedDate}:</h4>
                  <span className="text-[11px] font-bold text-emerald-400">{calendarEvents[selectedDate]?.length || 0} משימות</span>
                </div>

                <form onSubmit={addCalendarEvent} className="flex gap-2">
                  <input type="text" placeholder="הוסף משימה/תזכורת לתאריך הנבחר..." value={newEventText} onChange={(e) => setNewEventText(e.target.value)} className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  <button type="submit" className="bg-emerald-500 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs">שמור</button>
                </form>

                <div className="space-y-2 pt-1">
                  {(!calendarEvents[selectedDate] || calendarEvents[selectedDate].length === 0) ? (
                    <p className="text-xs text-slate-500 text-center py-3">אין משימות מתוזמנות לתאריך זה.</p>
                  ) : (
                    calendarEvents[selectedDate].map((ev, idx) => (
                      <div key={idx} className="bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs font-semibold text-slate-200 flex items-center gap-2">
                        <span className="text-emerald-400">📌</span>
                        <span>{ev}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* TAB 4: STATS */}
          {activeTab === 'stats' && (
            <div className="space-y-5">
              <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                <h3 className="text-xs font-bold text-slate-300 flex items-center gap-1.5"><span>🏆</span> מדליות והישגים</h3>
                <div className="grid grid-cols-2 gap-2.5">
                  {BADGES.map(b => (
                    <div key={b.id} className="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center gap-2.5">
                      <span className="text-2xl">{b.icon}</span>
                      <div>
                        <h4 className="text-xs font-bold text-slate-200">{b.name}</h4>
                        <p className="text-[10px] text-slate-400">{b.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Add Habit Modal */}
          {showAddHabitModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white">הוספת הרגל חדש</h3>
                  <button onClick={() => setShowAddHabitModal(false)} className="text-slate-400">✕</button>
                </div>
                <form onSubmit={addHabit} className="space-y-3">
                  <input type="text" required placeholder="שם ההרגל" value={newTitle} onChange={e => setNewTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  <input type="text" placeholder="צעד קטן של 2 דקות (מיקרו-הרגל)" value={newMicro} onChange={e => setNewMicro(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">שמור הרגל ב-Supabase</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
