<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusHabits</title>
  
  <!-- תמיכה באפליקציה בנייד (PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FocusHabits" />
  <meta name="theme-color" content="#020617" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="script"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="script"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://wwicfhomrexzczlhqlgx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_5fELLN6m3tMcIZxRmLNIYQ_OwX13l4i";

    const supabase = (SUPABASE_URL && SUPABASE_ANON_KEY) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    // צליל כפיים אמיתי בשילוב קונפטי חגיגי
    const playApplauseSound = () => {
      try {
        const audio = new Audio('https://www.myinstants.com/media/sounds/applause.mp3');
        audio.volume = 0.5;
        audio.play().catch(e => console.log("Audio play blocked:", e));
      } catch (e) {}
    };

    const DEFAULT_QUICK_TEMPLATES = [
      { id: 'q1', title: 'שתיית 2L מים', microHabit: 'לשתות כוס מים ראשונה על הבוקר', startTime: '08:00', isFavorite: true },
      { id: 'q2', title: 'אימון כושר / ריצה', microHabit: 'לנעול נעלי ספורט ולצאת ל-2 דקות', startTime: '07:00', isFavorite: true },
      { id: 'q3', title: 'קריאת ספר', microHabit: 'לקרוא עמוד אחד בלבד בספר', startTime: '21:30', isFavorite: true }
    ];

    const DAYS_OF_WEEK = [
      { id: 0, label: "א'" },
      { id: 1, label: "ב'" },
      { id: 2, label: "ג'" },
      { id: 3, label: "ד'" },
      { id: 4, label: "ה'" },
      { id: 5, label: "ו'" },
      { id: 6, label: "ש'" }
    ];

    const SHOPPING_CATEGORIES = ["כללי", "ירקות ופירות 🥑", "מוצרי חלב 🧀", "מאפים וסופר 🍞", "בשר ודגים 🥩", "מוצרי ניקיון 🧼"];
    const QUICK_TIMES = ["07:00", "08:00", "12:00", "18:00", "21:00"];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('focus_flow_user') || null);
      
      const [activeTab, setActiveTab] = useState('habits');
      const [habits, setHabits] = useState([]);
      const [filter, setFilter] = useState('all');
      const [showHabitModal, setShowHabitModal] = useState(false);
      const [editingHabit, setEditingHabit] = useState(null);
      
      const todayObj = new Date();
      const todayDateStr = todayObj.toISOString().split('T')[0];
      const currentDayOfWeek = todayObj.getDay();

      const [newTitle, setNewTitle] = useState('');
      const [newMicro, setNewMicro] = useState('');
      const [newStartTime, setNewStartTime] = useState('08:00');
      const [newStartDate, setNewStartDate] = useState(todayDateStr);
      const [newHabitUser, setNewHabitUser] = useState(currentUser || 'נועה');
      const [selectedDays, setSelectedDays] = useState([0, 1, 2, 3, 4, 5, 6]);
      const [newIsFavorite, setNewIsFavorite] = useState(false);

      // Chores State
      const [chores, setChores] = useState([]);
      const [showChoreModal, setShowChoreModal] = useState(false);
      const [editingChore, setEditingChore] = useState(null);
      const [newChoreTitle, setNewChoreTitle] = useState('');
      const [newChoreAssignee, setNewChoreAssignee] = useState(currentUser || 'נועה');
      const [newChoreDueDate, setNewChoreDueDate] = useState(todayDateStr);

      // Shopping List State
      const [shoppingItems, setShoppingItems] = useState([]);
      const [newItemTitle, setNewItemTitle] = useState('');
      const [newItemCategory, setNewItemCategory] = useState('כללי');

      // Calendar Events State
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [selectedDate, setSelectedDate] = useState(todayDateStr);
      const [calendarEvents, setCalendarEvents] = useState([]);
      const [showEventModal, setShowEventModal] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);
      const [newEventTitle, setNewEventTitle] = useState('');
      const [newEventTime, setNewEventTime] = useState('10:00');
      const [newEventAssignee, setNewEventAssignee] = useState('שניהם');

      // Confirm Delete Modal State
      const [deleteTarget, setDeleteTarget] = useState(null);

      const todayKey = todayDateStr;

      const handleSelectUser = (userName) => {
        setCurrentUser(userName);
        setNewHabitUser(userName);
        setNewChoreAssignee(userName);
        localStorage.setItem('focus_flow_user', userName);
      };

      const handleSwitchUser = () => {
        localStorage.removeItem('focus_flow_user');
        setCurrentUser(null);
      };

      // טעינת נתונים מ-Supabase
      useEffect(() => {
        async function fetchData() {
          if (supabase) {
            try {
              const { data: habitsData } = await supabase.from('habits').select('*');
              if (habitsData && habitsData.length > 0) {
                setHabits(habitsData.map(item => ({
                  ...item,
                  microHabit: item.micro_habit,
                  startTime: item.start_time,
                  startDate: item.created_at,
                  userName: item.user_name || 'נועה',
                  days: item.days || [0, 1, 2, 3, 4, 5, 6],
                  isFavorite: item.is_favorite || false,
                  logs: item.logs || {}
                })));
              }

              const { data: choresData } = await supabase.from('chores').select('*');
              if (choresData && choresData.length > 0) {
                setChores(choresData.map(item => ({
                  ...item,
                  assignedTo: item.assigned_to,
                  dueDate: item.due_date || todayDateStr
                })));
              }

              const { data: shoppingData } = await supabase.from('shopping_list').select('*').order('created_at', { ascending: false });
              if (shoppingData) {
                setShoppingItems(shoppingData.map(item => ({
                  id: item.id,
                  title: item.title,
                  category: item.category || 'כללי',
                  addedBy: item.added_by || 'שניהם',
                  bought: item.bought || false
                })));
              }

              const { data: eventsData } = await supabase.from('calendar_events').select('*');
              if (eventsData && eventsData.length > 0) {
                setCalendarEvents(eventsData.map(item => ({
                  id: item.id,
                  title: item.title,
                  date: item.event_date,
                  time: item.event_time,
                  assignedTo: item.assigned_to,
                  done: item.done
                })));
              }
            } catch (err) {
              console.error("Supabase fetch error:", err);
            }
          }
        }
        fetchData();
      }, []);

      if (!currentUser) {
        return (
          <div className="max-w-md mx-auto min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full text-center space-y-6 shadow-2xl">
              <div className="space-y-2">
                <span className="text-4xl">⚡</span>
                <h1 className="text-2xl font-black text-white">FocusHabits</h1>
                <p className="text-xs text-slate-400">מי משתמש במכשיר הזה כעת?</p>
              </div>

              <div className="grid grid-cols-2 gap-3 pt-2">
                <button
                  onClick={() => handleSelectUser('נועה')}
                  className="bg-slate-950 hover:bg-slate-800 border-2 border-purple-500/40 hover:border-purple-500 p-5 rounded-2xl flex flex-col items-center gap-2 transition-all shadow-lg group"
                >
                  <span className="text-3xl group-hover:scale-110 transition-transform">👩🏻‍🦰</span>
                  <span className="font-bold text-sm text-purple-300">נועה</span>
                </button>

                <button
                  onClick={() => handleSelectUser('רונאל')}
                  className="bg-slate-950 hover:bg-slate-800 border-2 border-blue-500/40 hover:border-blue-500 p-5 rounded-2xl flex flex-col items-center gap-2 transition-all shadow-lg group"
                >
                  <span className="text-3xl group-hover:scale-110 transition-transform">👦🏻</span>
                  <span className="font-bold text-sm text-blue-300">רונאל</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // --- HABITS ACTIONS ---
      const toggleHabit = async (id) => {
        const target = habits.find(h => h.id === id);
        if (!target) return;

        const isDone = !!(target.logs && target.logs[todayKey]);
        const updatedLogs = { ...(target.logs || {}) };

        if (isDone) {
          delete updatedLogs[todayKey];
        } else {
          updatedLogs[todayKey] = true;
          playApplauseSound();
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
        }

        const newStreak = !isDone ? target.streak + 1 : Math.max(0, target.streak - 1);
        const updatedHabits = habits.map(h => h.id === id ? { ...h, logs: updatedLogs, streak: newStreak } : h);

        setHabits(updatedHabits);

        if (supabase) {
          await supabase.from('habits').update({
            streak: newStreak,
            logs: updatedLogs
          }).eq('id', id);
        }
      };

      const toggleFavoriteHabit = async (habit, e) => {
        e.stopPropagation();
        const newFav = !habit.isFavorite;
        const updated = habits.map(h => h.id === habit.id ? { ...h, isFavorite: newFav } : h);
        setHabits(updated);

        if (supabase) {
          await supabase.from('habits').update({ is_favorite: newFav }).eq('id', habit.id);
        }
      };

      const openAddHabitModal = () => {
        setEditingHabit(null);
        setNewTitle('');
        setNewMicro('');
        setNewStartTime('08:00');
        setNewStartDate(todayDateStr);
        setNewHabitUser(currentUser);
        setSelectedDays([0, 1, 2, 3, 4, 5, 6]);
        setNewIsFavorite(false);
        setShowHabitModal(true);
      };

      const openEditHabitModal = (habit, e) => {
        e.stopPropagation();
        setEditingHabit(habit);
        setNewTitle(habit.title);
        setNewMicro(habit.microHabit || '');
        setNewStartTime(habit.startTime || '08:00');
        setNewStartDate(habit.startDate || todayDateStr);
        setNewHabitUser(habit.userName || currentUser);
        setSelectedDays(habit.days || [0, 1, 2, 3, 4, 5, 6]);
        setNewIsFavorite(habit.isFavorite || false);
        setShowHabitModal(true);
      };

      const addQuickHabit = async (tmpl) => {
        const habit = {
          id: Date.now().toString(),
          title: tmpl.title,
          microHabit: tmpl.microHabit || '',
          startTime: tmpl.startTime || '08:00',
          startDate: todayDateStr,
          userName: currentUser,
          days: [0, 1, 2, 3, 4, 5, 6],
          streak: 0,
          isFavorite: true,
          logs: {}
        };
        const updated = [...habits, habit];
        setHabits(updated);

        if (supabase) {
          await supabase.from('habits').insert([{
            id: habit.id,
            title: habit.title,
            micro_habit: habit.microHabit,
            start_time: habit.startTime,
            created_at: habit.startDate,
            user_name: habit.userName,
            days: habit.days,
            streak: 0,
            is_favorite: true,
            logs: {}
          }]);
        }
      };

      const saveHabit = async (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;

        if (editingHabit) {
          const updated = habits.map(h => h.id === editingHabit.id ? {
            ...h,
            title: newTitle,
            microHabit: newMicro,
            startTime: newStartTime,
            startDate: newStartDate,
            userName: newHabitUser,
            days: selectedDays,
            isFavorite: newIsFavorite
          } : h);
          setHabits(updated);

          if (supabase) {
            await supabase.from('habits').update({
              title: newTitle,
              micro_habit: newMicro,
              start_time: newStartTime,
              created_at: newStartDate,
              user_name: newHabitUser,
              days: selectedDays,
              is_favorite: newIsFavorite
            }).eq('id', editingHabit.id);
          }
        } else {
          const habit = {
            id: Date.now().toString(),
            title: newTitle,
            microHabit: newMicro,
            startTime: newStartTime,
            startDate: newStartDate,
            userName: newHabitUser,
            days: selectedDays,
            streak: 0,
            isFavorite: newIsFavorite,
            logs: {}
          };
          const updated = [...habits, habit];
          setHabits(updated);

          if (supabase) {
            await supabase.from('habits').insert([{
              id: habit.id,
              title: habit.title,
              micro_habit: habit.microHabit,
              start_time: habit.startTime,
              created_at: habit.startDate,
              user_name: habit.userName,
              days: habit.days,
              streak: 0,
              is_favorite: habit.isFavorite,
              logs: {}
            }]);
          }
        }
        setShowHabitModal(false);
      };

      // --- CHORES ACTIONS ---
      const toggleChore = async (id) => {
        const target = chores.find(c => c.id === id);
        if (!target) return;

        const newDone = !target.done;
        if (newDone) playApplauseSound();

        setChores(chores.map(c => c.id === id ? { ...c, done: newDone } : c));

        if (supabase) {
          await supabase.from('chores').update({ done: newDone }).eq('id', id);
        }
      };

      const openAddChoreModal = () => {
        setEditingChore(null);
        setNewChoreTitle('');
        setNewChoreAssignee(currentUser);
        setNewChoreDueDate(todayDateStr);
        setShowChoreModal(true);
      };

      const openEditChoreModal = (chore, e) => {
        e.stopPropagation();
        setEditingChore(chore);
        setNewChoreTitle(chore.title);
        setNewChoreAssignee(chore.assignedTo);
        setNewChoreDueDate(chore.dueDate || todayDateStr);
        setShowChoreModal(true);
      };

      const saveChore = async (e) => {
        e.preventDefault();
        if (!newChoreTitle.trim()) return;

        if (editingChore) {
          const updated = chores.map(c => c.id === editingChore.id ? {
            ...c,
            title: newChoreTitle,
            assignedTo: newChoreAssignee,
            dueDate: newChoreDueDate
          } : c);
          setChores(updated);

          if (supabase) {
            await supabase.from('chores').update({
              title: newChoreTitle,
              assigned_to: newChoreAssignee,
              due_date: newChoreDueDate
            }).eq('id', editingChore.id);
          }
        } else {
          const chore = {
            id: Date.now().toString(),
            title: newChoreTitle,
            assignedTo: newChoreAssignee,
            dueDate: newChoreDueDate,
            done: false
          };
          setChores([...chores, chore]);

          if (supabase) {
            await supabase.from('chores').insert([{
              id: chore.id,
              title: chore.title,
              assigned_to: chore.assignedTo,
              due_date: chore.dueDate,
              done: false
            }]);
          }
        }
        setShowChoreModal(false);
      };

      // --- SHOPPING LIST ACTIONS ---
      const addShoppingItem = async (e) => {
        e.preventDefault();
        if (!newItemTitle.trim()) return;

        const item = {
          id: Date.now().toString(),
          title: newItemTitle,
          category: newItemCategory,
          addedBy: currentUser,
          bought: false
        };

        setShoppingItems([item, ...shoppingItems]);
        setNewItemTitle('');

        if (supabase) {
          await supabase.from('shopping_list').insert([{
            id: item.id,
            title: item.title,
            category: item.category,
            added_by: item.addedBy,
            bought: false
          }]);
        }
      };

      const toggleShoppingBought = async (id) => {
        const target = shoppingItems.find(i => i.id === id);
        if (!target) return;

        const newBought = !target.bought;
        if (newBought) playApplauseSound();

        setShoppingItems(shoppingItems.map(i => i.id === id ? { ...i, bought: newBought } : i));

        if (supabase) {
          await supabase.from('shopping_list').update({ bought: newBought }).eq('id', id);
        }
      };

      const clearBoughtItems = async () => {
        const remaining = shoppingItems.filter(i => !i.bought);
        setShoppingItems(remaining);

        if (supabase) {
          await supabase.from('shopping_list').delete().eq('bought', true);
        }
      };

      // --- CALENDAR EVENTS ACTIONS ---
      const openAddEventModal = () => {
        setEditingEvent(null);
        setNewEventTitle('');
        setNewEventTime('10:00');
        setNewEventAssignee(currentUser);
        setShowEventModal(true);
      };

      const openEditEventModal = (ev, e) => {
        e.stopPropagation();
        setEditingEvent(ev);
        setNewEventTitle(ev.title);
        setNewEventTime(ev.time || '10:00');
        setNewEventAssignee(ev.assignedTo || 'שניהם');
        setShowEventModal(true);
      };

      const saveEvent = async (e) => {
        e.preventDefault();
        if (!newEventTitle.trim()) return;

        if (editingEvent) {
          const updated = calendarEvents.map(ev => ev.id === editingEvent.id ? {
            ...ev,
            title: newEventTitle,
            time: newEventTime,
            assignedTo: newEventAssignee,
            date: selectedDate
          } : ev);
          setCalendarEvents(updated);

          if (supabase) {
            await supabase.from('calendar_events').update({
              title: newEventTitle,
              event_time: newEventTime,
              assigned_to: newEventAssignee,
              event_date: selectedDate
            }).eq('id', editingEvent.id);
          }
        } else {
          const newEv = {
            id: Date.now().toString(),
            title: newEventTitle,
            date: selectedDate,
            time: newEventTime,
            assignedTo: newEventAssignee,
            done: false
          };
          setCalendarEvents([...calendarEvents, newEv]);

          if (supabase) {
            await supabase.from('calendar_events').insert([{
              id: newEv.id,
              title: newEv.title,
              event_date: newEv.date,
              event_time: newEv.time,
              assigned_to: newEv.assignedTo,
              done: false
            }]);
          }
        }
        setShowEventModal(false);
      };

      const toggleEventDone = async (id) => {
        const target = calendarEvents.find(ev => ev.id === id);
        if (!target) return;

        const newDone = !target.done;
        if (newDone) playApplauseSound();

        setCalendarEvents(calendarEvents.map(ev => ev.id === id ? { ...ev, done: newDone } : ev));

        if (supabase) {
          await supabase.from('calendar_events').update({ done: newDone }).eq('id', id);
        }
      };

      // --- CONFIRMED DELETE HANDLER ---
      const confirmExecuteDelete = async () => {
        if (!deleteTarget) return;

        if (deleteTarget.type === 'habit') {
          setHabits(habits.filter(h => h.id !== deleteTarget.id));
          if (supabase) await supabase.from('habits').delete().eq('id', deleteTarget.id);
        } else if (deleteTarget.type === 'chore') {
          setChores(chores.filter(c => c.id !== deleteTarget.id));
          if (supabase) await supabase.from('chores').delete().eq('id', deleteTarget.id);
        } else if (deleteTarget.type === 'shopping') {
          setShoppingItems(shoppingItems.filter(i => i.id !== deleteTarget.id));
          if (supabase) await supabase.from('shopping_list').delete().eq('id', deleteTarget.id);
        } else if (deleteTarget.type === 'event') {
          setCalendarEvents(calendarEvents.filter(ev => ev.id !== deleteTarget.id));
          if (supabase) await supabase.from('calendar_events').delete().eq('id', deleteTarget.id);
        }
        setDeleteTarget(null);
      };

      const toggleDaySelection = (dayId) => {
        if (selectedDays.includes(dayId)) {
          if (selectedDays.length > 1) setSelectedDays(selectedDays.filter(d => d !== dayId));
        } else {
          setSelectedDays([...selectedDays, dayId].sort());
        }
      };

      const setQuickDate = (offsetDays) => {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        setNewStartDate(d.toISOString().split('T')[0]);
      };

      const getDaysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
      const getFirstDayOfMonth = (y, m) => new Date(y, m, 1).getDay();

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const daysInMonth = getDaysInMonth(year, month);
      const firstDay = getFirstDayOfMonth(year, month);
      const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];

      const userHabits = habits.filter(h => h.userName === currentUser || h.userName === 'שניהם');

      const todaysHabits = userHabits.filter(h => {
        if (!h.days || h.days.length === 0) return true;
        return h.days.includes(currentDayOfWeek);
      });

      // מיון ההרגלים מהזמן המוקדם למאוחר באותו היום
      const sortedTodaysHabits = [...todaysHabits].sort((a, b) => {
        const timeA = a.startTime || '00:00';
        const timeB = b.startTime || '00:00';
        return timeA.localeCompare(timeB);
      });

      const totalCompletedToday = sortedTodaysHabits.filter(h => h.logs && h.logs[todayKey]).length;
      const progressPercent = sortedTodaysHabits.length > 0 ? Math.round((totalCompletedToday / sortedTodaysHabits.length) * 100) : 0;
      const maxStreakOverall = userHabits.reduce((max, h) => Math.max(max, h.streak || 0), 0);

      const filteredHabits = sortedTodaysHabits.filter(h => {
        const isDone = !!(h.logs && h.logs[todayKey]);
        if (filter === 'pending') return !isDone;
        if (filter === 'completed') return isDone;
        return true;
      });

      const favoriteHabitsList = userHabits.filter(h => h.isFavorite);
      const quickHabitsToDisplay = favoriteHabitsList.length > 0 ? favoriteHabitsList : DEFAULT_QUICK_TEMPLATES;

                          <div>
                            <span className="font-semibold text-slate-100 block">{ev.title}</span>
                            {ev.time && <span className="text-[10px] text-slate-400">⏰ {ev.time}</span>}
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold border ${ev.assignedTo === 'נועה' ? 'bg-purple-500/10 border-purple-500/30 text-purple-300' : ev.assignedTo === 'רונאל' ? 'bg-blue-500/10 border-blue-500/30 text-blue-300' : 'bg-amber-500/10 border-amber-500/30 text-amber-300'}`}>
                            👤 {ev.assignedTo}
                          </span>
                          <button onClick={(e) => openEditEventModal(ev, e)} className="text-slate-400 hover:text-emerald-400 p-1 text-xs">✏️</button>
                          <button onClick={(e) => { e.stopPropagation(); setDeleteTarget({ type: 'event', id: ev.id }); }} className="text-red-400 hover:text-red-300 p-1 text-xs">🗑️</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* TAB 5: STATS */}
          {activeTab === 'stats' && (
            <div className="space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center shadow-md">
                  <span className="text-xs text-slate-400 font-semibold">אחוז השלמה יומית ({currentUser})</span>
                  <div className="text-2xl font-black text-emerald-400 mt-1">{progressPercent}%</div>
                </div>
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center shadow-md">
                  <span className="text-xs text-slate-400 font-semibold">שיא רצף (Streak)</span>
                  <div className="text-2xl font-black text-amber-400 mt-1">🔥 {maxStreakOverall} ימים</div>
                </div>
              </div>

              <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-md">
                <h3 className="text-xs font-bold text-slate-200 flex items-center gap-1.5"><span>📈</span> סיכום פעילות של {currentUser}</h3>
                <div className="space-y-2 text-xs">
                  <div className="flex justify-between py-1.5 border-b border-slate-800">
                    <span className="text-slate-400">סה"כ הרגלים מתוכננים להיום:</span>
                    <span className="font-bold text-white">{sortedTodaysHabits.length}</span>
                  </div>
                  <div className="flex justify-between py-1.5 border-b border-slate-800">
                    <span className="text-slate-400">הרגלים שבוצעו היום:</span>
                    <span className="font-bold text-emerald-400">{totalCompletedToday} מתוך {sortedTodaysHabits.length}</span>
                  </div>
                  <div className="flex justify-between py-1.5">
                    <span className="text-slate-400">משימות בית פתוחות:</span>
                    <span className="font-bold text-amber-400">{userChores.filter(c => !c.done).length}</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* CONFIRM DELETE MODAL */}
          {deleteTarget && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-xs w-full text-center space-y-4 shadow-2xl">
                <div className="text-3xl">⚠️</div>
                <h3 className="font-bold text-base text-white">אישור מחיקה</h3>
                <p className="text-xs text-slate-300">האם אתה בטוח שברצונך למחוק פריט זה? הפעולה תמחק את המידע גם מהבסיס נתונים.</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={confirmExecuteDelete} className="flex-1 bg-red-500 hover:bg-red-400 text-white font-bold py-2 rounded-xl text-xs transition-all">
                    כן, מחק
                  </button>
                  <button onClick={() => setDeleteTarget(null)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs transition-all">
                    ביטול
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADD / EDIT CALENDAR EVENT MODAL */}
          {showEventModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white">{editingEvent ? 'עריכת אירוע ביומן' : 'הוספת אירוע ליומן'}</h3>
                  <button onClick={() => setShowEventModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={saveEvent} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">כותרת האירוע/המשימה</label>
                    <input type="text" required placeholder="למשל: פגישת זום, תור לרופא..." value={newEventTitle} onChange={e => setNewEventTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">משויך ל-</label>
                      <select value={newEventAssignee} onChange={e => setNewEventAssignee(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-bold outline-none">
                        <option value="נועה">נועה</option>
                        <option value="רונאל">רונאל</option>
                        <option value="שניהם">שניהם</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">שעה</label>
                      <input type="time" value={newEventTime} onChange={e => setNewEventTime(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-emerald-400 font-bold outline-none text-center" />
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs shadow-lg mt-2">
                    {editingEvent ? 'עדכן אירוע ב-DB' : 'שמור אירוע ב-DB'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ADD / EDIT HABIT MODAL */}
          {showHabitModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white">{editingHabit ? 'עריכת הרגל' : 'הוספת הרגל חדש'}</h3>
                  <button onClick={() => setShowHabitModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={saveHabit} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">שם ההרגל</label>
                    <input type="text" required placeholder="למשל: אימון כושר" value={newTitle} onChange={e => setNewTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">משויך ל-</label>
                    <select value={newHabitUser} onChange={e => setNewHabitUser(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-bold outline-none">
                      <option value="נועה">נועה</option>
                      <option value="רונאל">רונאל</option>
                      <option value="שניהם">שניהם</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">צעד קטן של 2 דקות (מיקרו-הרגל)</label>
                    <input type="text" placeholder="למשל: לנעול נעלי ספורט" value={newMicro} onChange={e => setNewMicro(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  </div>

                  <div className="flex items-center gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <input 
                      type="checkbox" 
                      id="favCheck"
                      checked={newIsFavorite} 
                      onChange={e => setNewIsFavorite(e.target.checked)} 
                      className="w-4 h-4 accent-emerald-500 cursor-pointer"
                    />
                    <label htmlFor="favCheck" className="text-xs text-slate-300 cursor-pointer font-semibold flex items-center gap-1">
                      ⭐ סמן כהרגל מועדף (יופיע בסרגל הוספה מהירה)
                    </label>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">שעת התחלה</label>
                    <div className="flex items-center gap-2 mb-1.5">
                      <input type="time" value={newStartTime} onChange={e => setNewStartTime(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-emerald-400 font-bold outline-none flex-1 text-center" />
                    </div>
                    <div className="flex justify-between gap-1">
                      {QUICK_TIMES.map(t => (
                        <button type="button" key={t} onClick={() => setNewStartTime(t)} className={`flex-1 py-1 text-[10px] font-bold rounded-lg border transition-all ${newStartTime === t ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                          {t}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">תאריך התחלה</label>
                    <input type="date" value={newStartDate} onChange={e => setNewStartDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-emerald-400 font-bold outline-none mb-1.5 text-center" />
                    <div className="flex gap-1.5">
                      <button type="button" onClick={() => setQuickDate(0)} className={`flex-1 py-1 text-[10px] font-bold rounded-lg border ${newStartDate === todayDateStr ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>היום</button>
                      <button type="button" onClick={() => setQuickDate(1)} className="flex-1 py-1 text-[10px] font-bold rounded-lg border bg-slate-950 border-slate-800 text-slate-400">מחר</button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">ימי חזרה בשבוע</label>
                    <div className="flex justify-between gap-1">
                      {DAYS_OF_WEEK.map(day => (
                        <button type="button" key={day.id} onClick={() => toggleDaySelection(day.id)} className={`w-8 h-8 rounded-xl font-bold text-xs border transition-all ${selectedDays.includes(day.id) ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                          {day.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs shadow-lg mt-2">
                    {editingHabit ? 'עדכן הרגל ב-DB' : 'שמור הרגל ב-DB'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ADD / EDIT CHORE MODAL */}
          {showChoreModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white">{editingChore ? 'עריכת משימת בית' : 'הוספת משימת בית'}</h3>
                  <button onClick={() => setShowChoreModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={saveChore} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">שם המשימה</label>
                    <input type="text" required placeholder="למשל: לקנות מצרכים לשבת" value={newChoreTitle} onChange={e => setNewChoreTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">משויך ל-</label>
                      <select value={newChoreAssignee} onChange={e => setNewChoreAssignee(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-bold outline-none">
                        <option value="נועה">נועה</option>
                        <option value="רונאל">רונאל</option>
                        <option value="שניהם">שניהם</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">תאריך יעד</label>
                      <input type="date" value={newChoreDueDate} onChange={e => setNewChoreDueDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-emerald-400 font-bold outline-none" />
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs shadow-lg mt-2">
                    {editingChore ? 'עדכן משימה ב-DB' : 'שמור משימה ב-DB'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
