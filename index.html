<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פוקוס-פלו | FocusFlow</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="script"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="script"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://wwicfhomrexzczlhqlgx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_5fELLN6m3tMcIZxRmLNIYQ_OwX13l4i";

    const supabase = (SUPABASE_URL && SUPABASE_ANON_KEY) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const playSuccessSound = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    };

    const QUICK_TEMPLATES = [
      { title: 'שתיית 2L מים', micro: 'לשתות כוס מים ראשונה על הבוקר', time: '08:00' },
      { title: 'אימון כושר / ריצה', micro: 'לנעול נעלי ספורט ולצאת ל-2 דקות', time: '07:00' },
      { title: 'קריאת ספר', micro: 'לקרוא עמוד אחד בלבד בספר', time: '21:30' },
      { title: 'מדיטציה / נשימות', micro: 'לקחת 3 נשימות עמוקות ומודעות', time: '07:30' }
    ];

    const DAYS_OF_WEEK = [
      { id: 0, label: "א'" },
      { id: 1, label: "ב'" },
      { id: 2, label: "ג'" },
      { id: 3, label: "ד'" },
      { id: 4, label: "ה'" },
      { id: 5, label: "ו'" },
      { id: 6, label: "ש'" }
    ];

    const QUICK_TIMES = ["07:00", "08:00", "12:00", "18:00", "21:00"];

    function App() {
      const [activeTab, setActiveTab] = useState('habits');
      const [currentUser, setCurrentUser] = useState('נועה');
      
      const [habits, setHabits] = useState([]);
      const [filter, setFilter] = useState('all');
      const [showHabitModal, setShowHabitModal] = useState(false);
      const [editingHabit, setEditingHabit] = useState(null);
      
      const todayDateStr = new Date().toISOString().split('T')[0];
      const [newTitle, setNewTitle] = useState('');
      const [newMicro, setNewMicro] = useState('');
      const [newStartTime, setNewStartTime] = useState('08:00');
      const [newStartDate, setNewStartDate] = useState(todayDateStr);
      const [selectedDays, setSelectedDays] = useState([0, 1, 2, 3, 4, 5, 6]);

      // Chores State
      const [chores, setChores] = useState([]);
      const [showChoreModal, setShowChoreModal] = useState(false);
      const [editingChore, setEditingChore] = useState(null);
      const [newChoreTitle, setNewChoreTitle] = useState('');
      const [newChoreAssignee, setNewChoreAssignee] = useState('נועה');
      const [newChoreDueDate, setNewChoreDueDate] = useState(todayDateStr);

      // Calendar Events State
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [selectedDate, setSelectedDate] = useState(todayDateStr);
      const [calendarEvents, setCalendarEvents] = useState([]);
      const [showEventModal, setShowEventModal] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);
      const [newEventTitle, setNewEventTitle] = useState('');
      const [newEventTime, setNewEventTime] = useState('10:00');
      const [newEventAssignee, setNewEventAssignee] = useState('שניהם');

      // Confirm Delete Modal State
      const [deleteTarget, setDeleteTarget] = useState(null);

      const todayKey = todayDateStr;

      // טעינת נתונים מ-Supabase
      useEffect(() => {
        async function fetchData() {
          if (supabase) {
            try {
              const { data: habitsData } = await supabase.from('habits').select('*');
              if (habitsData && habitsData.length > 0) {
                setHabits(habitsData.map(item => ({
                  ...item,
                  microHabit: item.micro_habit,
                  startTime: item.start_time,
                  startDate: item.created_at,
                  days: item.days || [0, 1, 2, 3, 4, 5, 6],
                  logs: item.logs || {}
                })));
              }

              const { data: choresData } = await supabase.from('chores').select('*');
              if (choresData && choresData.length > 0) {
                setChores(choresData.map(item => ({
                  ...item,
                  assignedTo: item.assigned_to,
                  dueDate: item.due_date || todayDateStr
                })));
              }

              const { data: eventsData } = await supabase.from('calendar_events').select('*');
              if (eventsData && eventsData.length > 0) {
                setCalendarEvents(eventsData.map(item => ({
                  id: item.id,
                  title: item.title,
                  date: item.event_date,
                  time: item.event_time,
                  assignedTo: item.assigned_to,
                  done: item.done
                })));
              }
            } catch (err) {
              console.error("Supabase fetch error:", err);
            }
          }
        }
        fetchData();
      }, []);

      // --- HABITS ACTIONS ---
      const toggleHabit = async (id) => {
        const target = habits.find(h => h.id === id);
        if (!target) return;

        const isDone = !!(target.logs && target.logs[todayKey]);
        const updatedLogs = { ...(target.logs || {}) };

        if (isDone) {
          delete updatedLogs[todayKey];
        } else {
          updatedLogs[todayKey] = true;
          playSuccessSound();
          if (window.confetti) {
            window.confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
          }
        }

        const newStreak = !isDone ? target.streak + 1 : Math.max(0, target.streak - 1);
        const updatedHabits = habits.map(h => h.id === id ? { ...h, logs: updatedLogs, streak: newStreak } : h);

        setHabits(updatedHabits);

        if (supabase) {
          await supabase.from('habits').upsert({
            id: target.id,
            title: target.title,
            micro_habit: target.microHabit,
            start_time: target.startTime,
            created_at: target.startDate,
            days: target.days,
            streak: newStreak,
            logs: updatedLogs
          });
        }
      };

      const openAddHabitModal = () => {
        setEditingHabit(null);
        setNewTitle('');
        setNewMicro('');
        setNewStartTime('08:00');
        setNewStartDate(todayDateStr);
        setSelectedDays([0, 1, 2, 3, 4, 5, 6]);
        setShowHabitModal(true);
      };

      const openEditHabitModal = (habit, e) => {
        e.stopPropagation();
        setEditingHabit(habit);
        setNewTitle(habit.title);
        setNewMicro(habit.microHabit || '');
        setNewStartTime(habit.startTime || '08:00');
        setNewStartDate(habit.startDate || todayDateStr);
        setSelectedDays(habit.days || [0, 1, 2, 3, 4, 5, 6]);
        setShowHabitModal(true);
      };

      const addQuickHabit = async (tmpl) => {
        const habit = {
          id: Date.now().toString(),
          title: tmpl.title,
          microHabit: tmpl.micro,
          startTime: tmpl.time,
          startDate: todayDateStr,
          days: [0, 1, 2, 3, 4, 5, 6],
          streak: 0,
          logs: {}
        };
        const updated = [...habits, habit];
        setHabits(updated);

        if (supabase) {
          await supabase.from('habits').insert([{
            id: habit.id,
            title: habit.title,
            micro_habit: habit.microHabit,
            start_time: habit.startTime,
            created_at: habit.startDate,
            days: habit.days,
            streak: 0,
            logs: {}
          }]);
        }
      };

      const saveHabit = async (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;

        if (editingHabit) {
          const updated = habits.map(h => h.id === editingHabit.id ? {
            ...h,
            title: newTitle,
            microHabit: newMicro,
            startTime: newStartTime,
            startDate: newStartDate,
            days: selectedDays
          } : h);
          setHabits(updated);

          if (supabase) {
            await supabase.from('habits').update({
              title: newTitle,
              micro_habit: newMicro,
              start_time: newStartTime,
              created_at: newStartDate,
              days: selectedDays
            }).eq('id', editingHabit.id);
          }
        } else {
          const habit = {
            id: Date.now().toString(),
            title: newTitle,
            microHabit: newMicro,
            startTime: newStartTime,
            startDate: newStartDate,
            days: selectedDays,
            streak: 0,
            logs: {}
          };
          const updated = [...habits, habit];
          setHabits(updated);

          if (supabase) {
            await supabase.from('habits').insert([{
              id: habit.id,
              title: habit.title,
              micro_habit: habit.microHabit,
              start_time: habit.startTime,
              created_at: habit.startDate,
              days: habit.days,
              streak: 0,
              logs: {}
            }]);
          }
        }
        setShowHabitModal(false);
      };

      // --- CHORES ACTIONS ---
      const toggleChore = async (id) => {
        const target = chores.find(c => c.id === id);
        if (!target) return;

        const newDone = !target.done;
        if (newDone) playSuccessSound();

        setChores(chores.map(c => c.id === id ? { ...c, done: newDone } : c));

        if (supabase) {
          await supabase.from('chores').update({ done: newDone }).eq('id', id);
        }
      };

      const openAddChoreModal = () => {
        setEditingChore(null);
        setNewChoreTitle('');
        setNewChoreAssignee(currentUser);
        setNewChoreDueDate(todayDateStr);
        setShowChoreModal(true);
      };

      const openEditChoreModal = (chore, e) => {
        e.stopPropagation();
        setEditingChore(chore);
        setNewChoreTitle(chore.title);
        setNewChoreAssignee(chore.assignedTo);
        setNewChoreDueDate(chore.dueDate || todayDateStr);
        setShowChoreModal(true);
      };

      const saveChore = async (e) => {
        e.preventDefault();
        if (!newChoreTitle.trim()) return;

        if (editingChore) {
          const updated = chores.map(c => c.id === editingChore.id ? {
            ...c,
            title: newChoreTitle,
            assignedTo: newChoreAssignee,
            dueDate: newChoreDueDate
          } : c);
          setChores(updated);

          if (supabase) {
            await supabase.from('chores').update({
              title: newChoreTitle,
              assigned_to: newChoreAssignee,
              due_date: newChoreDueDate
            }).eq('id', editingChore.id);
          }
        } else {
          const chore = {
            id: Date.now().toString(),
            title: newChoreTitle,
            assignedTo: newChoreAssignee,
            dueDate: newChoreDueDate,
            done: false
          };
          setChores([...chores, chore]);

          if (supabase) {
            await supabase.from('chores').insert([{
              id: chore.id,
              title: chore.title,
              assigned_to: chore.assignedTo,
              due_date: chore.dueDate,
              done: false
            }]);
          }
        }
        setShowChoreModal(false);
      };

      // --- CALENDAR EVENTS ACTIONS (POPUPS & USER ASSIGNMENT) ---
      const openAddEventModal = () => {
        setEditingEvent(null);
        setNewEventTitle('');
        setNewEventTime('10:00');
        setNewEventAssignee(currentUser);
        setShowEventModal(true);
      };

      const openEditEventModal = (ev, e) => {
        e.stopPropagation();
        setEditingEvent(ev);
        setNewEventTitle(ev.title);
        setNewEventTime(ev.time || '10:00');
        setNewEventAssignee(ev.assignedTo || 'שניהם');
        setShowEventModal(true);
      };

      const saveEvent = async (e) => {
        e.preventDefault();
        if (!newEventTitle.trim()) return;

        if (editingEvent) {
          const updated = calendarEvents.map(ev => ev.id === editingEvent.id ? {
            ...ev,
            title: newEventTitle,
            time: newEventTime,
            assignedTo: newEventAssignee,
            date: selectedDate
          } : ev);
          setCalendarEvents(updated);

          if (supabase) {
            await supabase.from('calendar_events').update({
              title: newEventTitle,
              event_time: newEventTime,
              assigned_to: newEventAssignee,
              event_date: selectedDate
            }).eq('id', editingEvent.id);
          }
        } else {
          const newEv = {
            id: Date.now().toString(),
            title: newEventTitle,
            date: selectedDate,
            time: newEventTime,
            assignedTo: newEventAssignee,
            done: false
          };
          setCalendarEvents([...calendarEvents, newEv]);

          if (supabase) {
            await supabase.from('calendar_events').insert([{
              id: newEv.id,
              title: newEv.title,
              event_date: newEv.date,
              event_time: newEv.time,
              assigned_to: newEv.assignedTo,
              done: false
            }]);
          }
        }
        setShowEventModal(false);
      };

      const toggleEventDone = async (id) => {
        const target = calendarEvents.find(ev => ev.id === id);
        if (!target) return;

        const newDone = !target.done;
        if (newDone) playSuccessSound();

        setCalendarEvents(calendarEvents.map(ev => ev.id === id ? { ...ev, done: newDone } : ev));

        if (supabase) {
          await supabase.from('calendar_events').update({ done: newDone }).eq('id', id);
        }
      };

      // --- CONFIRMED DELETE HANDLER ---
      const confirmExecuteDelete = async () => {
        if (!deleteTarget) return;

        if (deleteTarget.type === 'habit') {
          setHabits(habits.filter(h => h.id !== deleteTarget.id));
          if (supabase) await supabase.from('habits').delete().eq('id', deleteTarget.id);
        } else if (deleteTarget.type === 'chore') {
          setChores(chores.filter(c => c.id !== deleteTarget.id));
          if (supabase) await supabase.from('chores').delete().eq('id', deleteTarget.id);
        } else if (deleteTarget.type === 'event') {
          setCalendarEvents(calendarEvents.filter(ev => ev.id !== deleteTarget.id));
          if (supabase) await supabase.from('calendar_events').delete().eq('id', deleteTarget.id);
        }
        setDeleteTarget(null);
      };

      const toggleDaySelection = (dayId) => {
        if (selectedDays.includes(dayId)) {
          if (selectedDays.length > 1) setSelectedDays(selectedDays.filter(d => d !== dayId));
        } else {
          setSelectedDays([...selectedDays, dayId].sort());
        }
      };

      const setQuickDate = (offsetDays) => {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        setNewStartDate(d.toISOString().split('T')[0]);
      };

      const getDaysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
      const getFirstDayOfMonth = (y, m) => new Date(y, m, 1).getDay();

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const daysInMonth = getDaysInMonth(year, month);
      const firstDay = getFirstDayOfMonth(year, month);
      const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];

      const totalCompletedToday = habits.filter(h => h.logs && h.logs[todayKey]).length;
      const progressPercent = habits.length > 0 ? Math.round((totalCompletedToday / habits.length) * 100) : 0;
      const maxStreakOverall = habits.reduce((max, h) => Math.max(max, h.streak || 0), 0);

      const filteredHabits = habits.filter(h => {
        const isDone = !!(h.logs && h.logs[todayKey]);
        if (filter === 'pending') return !isDone;
        if (filter === 'completed') return isDone;
        return true;
      });

      const selectedDateEvents = calendarEvents.filter(ev => ev.date === selectedDate);

      return (
        <div className="max-w-md mx-auto p-4 sm:p-6 space-y-5 pb-24">
          <header className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
            <div className="flex items-center justify-between">
              <div>
                <h1 className="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                  <span className="text-emerald-400">⚡</span> פוקוס-פלו
                </h1>
                <p className="text-xs text-emerald-400/90 font-medium mt-0.5 flex items-center gap-1">
                  <span>☁️</span> סנכרון DB בזמן אמת
                </p>
              </div>

              <div className="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-2xl flex items-center gap-2">
                <span className="text-xs text-slate-400">משתמש:</span>
                <select 
                  value={currentUser} 
                  onChange={(e) => setCurrentUser(e.target.value)}
                  className="bg-transparent text-xs font-bold text-emerald-400 outline-none cursor-pointer"
                >
                  <option value="נועה" className="bg-slate-900 text-white">נועה 👩🏻‍🦰</option>
                  <option value="רונאל" className="bg-slate-900 text-white">רונאל 👦🏻</option>
                </select>
              </div>
            </div>

            {activeTab === 'habits' && (
              <div className="space-y-1.5 pt-2 border-t border-slate-800/80">
                <div className="flex justify-between text-xs font-semibold">
                  <span className="text-slate-300">התקדמות יומית</span>
                  <span className="text-emerald-400 font-bold">{progressPercent}%</span>
                </div>
                <div className="h-3 w-full bg-slate-950 rounded-full overflow-hidden p-0.5 border border-slate-800">
                  <div 
                    className="h-full bg-gradient-to-l from-emerald-400 to-teal-500 rounded-full transition-all duration-500"
                    style={{ width: progressPercent + '%' }}
                  />
                </div>
              </div>
            )}
          </header>

          <nav className="grid grid-cols-4 gap-1 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 text-[11px] font-bold">
            <button onClick={() => setActiveTab('habits')} className={`py-2 rounded-xl transition-all flex flex-col items-center gap-1 ${activeTab === 'habits' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400'}`}>
              <span className="text-base">⚡</span> הרגלים
            </button>
            <button onClick={() => setActiveTab('chores')} className={`py-2 rounded-xl transition-all flex flex-col items-center gap-1 ${activeTab === 'chores' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400'}`}>
              <span className="text-base">🏠</span> משימות
            </button>
            <button onClick={() => setActiveTab('calendar')} className={`py-2 rounded-xl transition-all flex flex-col items-center gap-1 ${activeTab === 'calendar' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400'}`}>
              <span className="text-base">📅</span> יומן
            </button>
            <button onClick={() => setActiveTab('stats')} className={`py-2 rounded-xl transition-all flex flex-col items-center gap-1 ${activeTab === 'stats' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400'}`}>
              <span className="text-base">📊</span> נתונים
            </button>
          </nav>

          {/* TAB 1: HABITS */}
          {activeTab === 'habits' && (
            <div className="space-y-4">
              <div className="space-y-2">
                <h4 className="text-[11px] font-bold text-slate-400 flex items-center gap-1">🚀 הוספה מהירה בלחיצה:</h4>
                <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                  {QUICK_TEMPLATES.map((tmpl, i) => (
                    <button
                      key={i}
                      onClick={() => addQuickHabit(tmpl)}
                      className="whitespace-nowrap bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-emerald-500/50 text-slate-200 text-xs px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition-all shadow-sm shrink-0"
                    >
                      <span className="text-emerald-400">+</span> {tmpl.title}
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex items-center justify-between pt-1">
                <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-medium">
                  <button onClick={() => setFilter('all')} className={`px-3 py-1 rounded-lg ${filter === 'all' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}>הכל</button>
                  <button onClick={() => setFilter('pending')} className={`px-3 py-1 rounded-lg ${filter === 'pending' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}>לביצוע</button>
                  <button onClick={() => setFilter('completed')} className={`px-3 py-1 rounded-lg ${filter === 'completed' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}>הושלם</button>
                </div>
                <button onClick={openAddHabitModal} className="bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs shadow-md">+ הרגל מותאם</button>
              </div>

              <div className="space-y-3">
                {filteredHabits.length === 0 ? (
                  <div className="text-center py-8 text-xs text-slate-500 border border-dashed border-slate-800 rounded-2xl">
                    אין הרגלים בקטגוריה זו. לחצי על "+ הרגל" כדי ליצור!
                  </div>
                ) : (
                  filteredHabits.map(habit => {
                    const isDone = !!(habit.logs && habit.logs[todayKey]);
                    return (
                      <div key={habit.id} onClick={() => toggleHabit(habit.id)} className={`p-4 rounded-2xl border cursor-pointer transition-all flex items-start gap-3.5 ${isDone ? 'bg-emerald-950/20 border-emerald-500/40 opacity-80' : 'bg-slate-900 border-slate-800'}`}>
                        <div className={`mt-0.5 w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${isDone ? 'bg-emerald-500 border-emerald-500 text-slate-950 scale-105' : 'border-slate-600 bg-slate-950'}`}>
                          {isDone && <span className="font-black text-xs">✓</span>}
                        </div>

                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between gap-2">
                            <h3 className={`font-bold text-sm truncate ${isDone ? 'line-through text-slate-400' : 'text-slate-100'}`}>{habit.title}</h3>
                            <div className="flex items-center gap-1.5">
                              {habit.startTime && (
                                <span className="text-[10px] text-slate-400 bg-slate-950 px-2 py-0.5 rounded-md border border-slate-800">
                                  ⏰ {habit.startTime}
                                </span>
                              )}
                              <span className="text-xs font-bold text-amber-400 bg-amber-400/10 border border-amber-400/20 px-2 py-0.5 rounded-full">🔥 {habit.streak}</span>
                            </div>
                          </div>

                          {habit.microHabit && <p className="text-xs text-emerald-400/90 mt-1.5 flex items-center gap-1 bg-emerald-500/10 p-1.5 rounded-lg border border-emerald-500/20"><span>💡</span> {habit.microHabit}</p>}

                          <div className="flex items-center justify-end gap-2 pt-2 mt-1 border-t border-slate-800/60">
                            <button 
                              onClick={(e) => openEditHabitModal(habit, e)}
                              className="text-[11px] text-slate-400 hover:text-emerald-400 flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800 transition-all"
                            >
                              ✏️ ערוך
                            </button>
                            <button 
                              onClick={(e) => { e.stopPropagation(); setDeleteTarget({ type: 'habit', id: habit.id }); }}
                              className="text-[11px] text-red-400 hover:text-red-300 flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800 transition-all"
                            >
                              🗑️ מחק
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          )}

          {/* TAB 2: CHORES */}
          {activeTab === 'chores' && (
            <div className="space-y-4">
              <div className="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-md">
                <div>
                  <h3 className="text-xs font-bold text-slate-200">משימות בית זוגיות</h3>
                  <p className="text-[11px] text-slate-400">מסונכרנות בין נועה לרונאל ב-DB</p>
                </div>
                <button onClick={openAddChoreModal} className="bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs shadow-md">
                  + משימה חדשה
                </button>
              </div>

              <div className="space-y-2.5">
                {chores.length === 0 ? (
                  <div className="text-center py-8 text-xs text-slate-500 border border-dashed border-slate-800 rounded-2xl">
                    אין משימות בית זוגיות. לחצי על "+ משימה חדשה" כדי להוסיף!
                  </div>
                ) : (
                  chores.map(chore => (
                    <div key={chore.id} onClick={() => toggleChore(chore.id)} className={`p-4 rounded-2xl border cursor-pointer transition-all flex items-center justify-between ${chore.done ? 'bg-slate-950/50 border-slate-900 opacity-60' : 'bg-slate-900 border-slate-800'}`}>
                      <div className="flex items-center gap-3">
                        <div className={`w-5 h-5 rounded-md border-2 flex items-center justify-center ${chore.done ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600 bg-slate-950'}`}>{chore.done && <span className="font-bold text-xs">✓</span>}</div>
                        <div>
                          <span className={`text-sm font-semibold block ${chore.done ? 'line-through text-slate-500' : 'text-slate-100'}`}>{chore.title}</span>
                          {chore.dueDate && <span className="text-[10px] text-slate-400">📅 יעד: {chore.dueDate}</span>}
                        </div>
                      </div>

                      <div className="flex items-center gap-2">
                        <span className={`text-xs px-2.5 py-1 rounded-full font-bold border ${chore.assignedTo === 'נועה' ? 'bg-purple-500/10 border-purple-500/30 text-purple-300' : 'bg-blue-500/10 border-blue-500/30 text-blue-300'}`}>
                          👤 {chore.assignedTo}
                        </span>
                        <button onClick={(e) => openEditChoreModal(chore, e)} className="text-slate-400 hover:text-emerald-400 p-1 text-xs">✏️</button>
                        <button onClick={(e) => { e.stopPropagation(); setDeleteTarget({ type: 'chore', id: chore.id }); }} className="text-red-400 hover:text-red-300 p-1 text-xs">🗑️</button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* TAB 3: CALENDAR (WITH POPUP ADD/EDIT & ASSIGNMENT) */}
          {activeTab === 'calendar' && (
            <div className="space-y-4">
              <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-4 shadow-lg">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <button onClick={() => setCurrentMonth(new Date(year, month - 1, 1))} className="text-xs bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-emerald-400 font-bold">הקודם</button>
                  <h3 className="font-bold text-sm text-white">{monthNames[month]} {year}</h3>
                  <button onClick={() => setCurrentMonth(new Date(year, month + 1, 1))} className="text-xs bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-emerald-400 font-bold">הבא</button>
                </div>

                <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400">
                  <span>א'</span><span>ב'</span><span>ג'</span><span>ד'</span><span>ה'</span><span>ו'</span><span>ש'</span>
                </div>

                <div className="grid grid-cols-7 gap-1 text-center text-xs">
                  {Array.from({ length: firstDay }).map((_, i) => <div key={'empty-' + i} />)}
                  {Array.from({ length: daysInMonth }).map((_, i) => {
                    const dayNum = i + 1;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                    const isSelected = selectedDate === dateStr;
                    const isToday = todayKey === dateStr;
                    const hasEvents = calendarEvents.some(ev => ev.date === dateStr);

                    return (
                      <button
                        key={dayNum}
                        onClick={() => setSelectedDate(dateStr)}
                        className={`py-2 rounded-xl border relative font-semibold transition-all ${
                          isSelected ? 'bg-emerald-500 border-emerald-500 text-slate-950 font-black scale-105' :
                          isToday ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-400' :
                          'bg-slate-950 border-slate-800/80 text-slate-200'
                        }`}
                      >
                        {dayNum}
                        {hasEvents && <span className="absolute bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-amber-400 rounded-full" />}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div>
                    <h4 className="text-xs font-bold text-slate-200">אירועים ליום {selectedDate}:</h4>
                    <span className="text-[10px] text-slate-400">{selectedDateEvents.length} משימות מתוזמנות</span>
                  </div>
                  <button onClick={openAddEventModal} className="bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs shadow-md">
                    + אירוע ליומן
                  </button>
                </div>

                <div className="space-y-2 pt-1">
                  {selectedDateEvents.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-4 border border-dashed border-slate-800 rounded-2xl">
                      אין משימות מתוזמנות לתאריך זה. לחצי על "+ אירוע ליומן" להוספה!
                    </p>
                  ) : (
                    selectedDateEvents.map(ev => (
                      <div key={ev.id} onClick={() => toggleEventDone(ev.id)} className={`bg-slate-950 border border-slate-800 p-3.5 rounded-2xl text-xs cursor-pointer transition-all flex items-center justify-between ${ev.done ? 'opacity-50 line-through' : ''}`}>
                        <div className="flex items-center gap-2.5">
                          <div className={`w-4 h-4 rounded-md border flex items-center justify-center ${ev.done ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600'}`}>
                            {ev.done && <span className="font-bold text-[10px]">✓</span>}
                          </div>
                          <div>
                            <span className="font-semibold text-slate-100 block">{ev.title}</span>
                            {ev.time && <span className="text-[10px] text-slate-400">⏰ {ev.time}</span>}
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold border ${ev.assignedTo === 'נועה' ? 'bg-purple-500/10 border-purple-500/30 text-purple-300' : ev.assignedTo === 'רונאל' ? 'bg-blue-500/10 border-blue-500/30 text-blue-300' : 'bg-amber-500/10 border-amber-500/30 text-amber-300'}`}>
                            👤 {ev.assignedTo}
                          </span>
                          <button onClick={(e) => openEditEventModal(ev, e)} className="text-slate-400 hover:text-emerald-400 p-1 text-xs">✏️</button>
                          <button onClick={(e) => { e.stopPropagation(); setDeleteTarget({ type: 'event', id: ev.id }); }} className="text-red-400 hover:text-red-300 p-1 text-xs">🗑️</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* TAB 4: STATS */}
          {activeTab === 'stats' && (
            <div className="space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center shadow-md">
                  <span className="text-xs text-slate-400 font-semibold">אחוז השלמה יומית</span>
                  <div className="text-2xl font-black text-emerald-400 mt-1">{progressPercent}%</div>
                </div>
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center shadow-md">
                  <span className="text-xs text-slate-400 font-semibold">שיא רצף (Streak)</span>
                  <div className="text-2xl font-black text-amber-400 mt-1">🔥 {maxStreakOverall} ימים</div>
                </div>
              </div>

              <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-md">
                <h3 className="text-xs font-bold text-slate-200 flex items-center gap-1.5"><span>📈</span> סיכום פעילות</h3>
                <div className="space-y-2 text-xs">
                  <div className="flex justify-between py-1.5 border-b border-slate-800">
                    <span className="text-slate-400">סה"כ הרגלים פעילים:</span>
                    <span className="font-bold text-white">{habits.length}</span>
                  </div>
                  <div className="flex justify-between py-1.5 border-b border-slate-800">
                    <span className="text-slate-400">הרגלים שבוצעו היום:</span>
                    <span className="font-bold text-emerald-400">{totalCompletedToday} מתוך {habits.length}</span>
                  </div>
                  <div className="flex justify-between py-1.5">
                    <span className="text-slate-400">משימות בית פתוחות:</span>
                    <span className="font-bold text-amber-400">{chores.filter(c => !c.done).length}</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* CONFIRM DELETE MODAL */}
          {deleteTarget && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-xs w-full text-center space-y-4 shadow-2xl">
                <div className="text-3xl">⚠️</div>
                <h3 className="font-bold text-base text-white">אישור מחיקה</h3>
                <p className="text-xs text-slate-300">האם אתה בטוח שברצונך למחוק פריט זה? הפעולה תמחק את המידע גם מהבסיס נתונים.</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={confirmExecuteDelete} className="flex-1 bg-red-500 hover:bg-red-400 text-white font-bold py-2 rounded-xl text-xs transition-all">
                    כן, מחק
                  </button>
                  <button onClick={() => setDeleteTarget(null)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs transition-all">
                    ביטול
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADD / EDIT CALENDAR EVENT MODAL */}
          {showEventModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white">{editingEvent ? 'עריכת אירוע ביומן' : 'הוספת אירוע ליומן'}</h3>
                  <button onClick={() => setShowEventModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={saveEvent} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">כותרת האירוע/המשימה</label>
                    <input type="text" required placeholder="למשל: פגישת זום, תור לרופא..." value={newEventTitle} onChange={e => setNewEventTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">משויך ל-</label>
                      <select value={newEventAssignee} onChange={e => setNewEventAssignee(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-bold outline-none">
                        <option value="נועה">נועה</option>
                        <option value="רונאל">רונאל</option>
                        <option value="שניהם">שניהם</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">שעה</label>
                      <input type="time" value={newEventTime} onChange={e => setNewEventTime(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-emerald-400 font-bold outline-none text-center" />
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs shadow-lg mt-2">
                    {editingEvent ? 'עדכן אירוע ב-DB' : 'שמור אירוע ב-DB'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ADD / EDIT HABIT MODAL */}
          {showHabitModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white">{editingHabit ? 'עריכת הרגל' : 'הוספת הרגל חדש'}</h3>
                  <button onClick={() => setShowHabitModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={saveHabit} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">שם ההרגל</label>
                    <input type="text" required placeholder="למשל: אימון כושר" value={newTitle} onChange={e => setNewTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">צעד קטן של 2 דקות (מיקרו-הרגל)</label>
                    <input type="text" placeholder="למשל: לנעול נעלי ספורט" value={newMicro} onChange={e => setNewMicro(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">שעת התחלה</label>
                    <div className="flex items-center gap-2 mb-1.5">
                      <input type="time" value={newStartTime} onChange={e => setNewStartTime(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-emerald-400 font-bold outline-none flex-1 text-center" />
                    </div>
                    <div className="flex justify-between gap-1">
                      {QUICK_TIMES.map(t => (
                        <button type="button" key={t} onClick={() => setNewStartTime(t)} className={`flex-1 py-1 text-[10px] font-bold rounded-lg border transition-all ${newStartTime === t ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                          {t}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">תאריך התחלה</label>
                    <input type="date" value={newStartDate} onChange={e => setNewStartDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-emerald-400 font-bold outline-none mb-1.5 text-center" />
                    <div className="flex gap-1.5">
                      <button type="button" onClick={() => setQuickDate(0)} className={`flex-1 py-1 text-[10px] font-bold rounded-lg border ${newStartDate === todayDateStr ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>היום</button>
                      <button type="button" onClick={() => setQuickDate(1)} className="flex-1 py-1 text-[10px] font-bold rounded-lg border bg-slate-950 border-slate-800 text-slate-400">מחר</button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">ימי חזרה בשבוע</label>
                    <div className="flex justify-between gap-1">
                      {DAYS_OF_WEEK.map(day => (
                        <button type="button" key={day.id} onClick={() => toggleDaySelection(day.id)} className={`w-8 h-8 rounded-xl font-bold text-xs border transition-all ${selectedDays.includes(day.id) ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                          {day.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs shadow-lg mt-2">
                    {editingHabit ? 'עדכן הרגל ב-DB' : 'שמור הרגל ב-DB'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ADD / EDIT CHORE MODAL */}
          {showChoreModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white">{editingChore ? 'עריכת משימת בית' : 'הוספת משימת בית'}</h3>
                  <button onClick={() => setShowChoreModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={saveChore} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">שם המשימה</label>
                    <input type="text" required placeholder="למשל: לקנות מצרכים לשבת" value={newChoreTitle} onChange={e => setNewChoreTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">משויך ל-</label>
                      <select value={newChoreAssignee} onChange={e => setNewChoreAssignee(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-bold outline-none">
                        <option value="נועה">נועה</option>
                        <option value="רונאל">רונאל</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">תאריך יעד</label>
                      <input type="date" value={newChoreDueDate} onChange={e => setNewChoreDueDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-emerald-400 font-bold outline-none" />
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs shadow-lg mt-2">
                    {editingChore ? 'עדכן משימה ב-DB' : 'שמור משימה ב-DB'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
